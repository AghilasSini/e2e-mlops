{{- if eq (include "e2e-mlops.featureLogActive" .) "true" }}
{{- $name := printf "%s-feature-logger" (include "e2e-mlops.fullname" .) }}
# Feature logger: receives the request/response CloudEvents of KServe's logger sidecar
# and stores them in the feature-log database (created by the tracking bootstrap hook).
# It holds only its own database credentials: no MLflow or object-store Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "e2e-mlops.labels" . | nindent 4 }}
    app.kubernetes.io/component: feature-logger
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "e2e-mlops.selector" (list . "feature-logger") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "e2e-mlops.labels" . | nindent 8 }}
        app.kubernetes.io/component: feature-logger
    spec:
      {{- include "e2e-mlops.podCommon" . | nindent 6 }}
      containers:
        - name: feature-logger
          image: {{ include "e2e-mlops.image" (list . "feature-logger") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.featureLog.port }}
          env:
            {{- include "e2e-mlops.secretEnv" (list "FEATURE_LOG_DB_USER" .Values.secrets.featureLog "username") | nindent 12 }}
            {{- include "e2e-mlops.secretEnv" (list "FEATURE_LOG_DB_PASSWORD" .Values.secrets.featureLog "password") | nindent 12 }}
            - name: FEATURE_LOG_DATABASE_URL
              value: {{ printf "postgresql+psycopg2://$(FEATURE_LOG_DB_USER)@%s:%v/%s" (include "e2e-mlops.postgresHost" .) .Values.postgres.port .Values.featureLog.database | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.featureLog.resources | nindent 12 }}
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 5
            periodSeconds: 15
          # Process readiness, not database readiness: Helm waits for this pod *before*
          # the post-install hook creates the database. /health/ready reports the
          # database; events that cannot be stored are answered 503 and counted.
          readinessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.featureLog.tmpSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "e2e-mlops.labels" . | nindent 4 }}
    app.kubernetes.io/component: feature-logger
spec:
  type: ClusterIP
  selector:
    {{- include "e2e-mlops.selector" (list . "feature-logger") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.featureLog.networkPolicy.enabled }}
---
# Only the predictor pods (their logger sidecar) may reach the feature logger.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "e2e-mlops.labels" . | nindent 4 }}
    app.kubernetes.io/component: feature-logger
spec:
  podSelector:
    matchLabels:
      {{- include "e2e-mlops.selector" (list . "feature-logger") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              serving.kserve.io/inferenceservice: {{ .Values.tracking.modelName }}
      ports:
        - protocol: TCP
          port: {{ .Values.featureLog.port }}
{{- end }}
{{- end }}
