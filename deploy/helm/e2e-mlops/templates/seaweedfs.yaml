{{- if and .Values.tracking.enabled (eq .Values.objectStore.mode "internal") }}
{{- $name := printf "%s-seaweedfs" (include "e2e-mlops.fullname" .) }}
{{- $s3 := .Values.objectStore.internal }}
# Single-process SeaweedFS (master + volume + filer + S3 gateway) for the local profile.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "e2e-mlops.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store
spec:
  type: ClusterIP
  selector:
    {{- include "e2e-mlops.selector" (list . "object-store") | nindent 4 }}
  ports:
    - name: s3
      port: {{ $s3.s3Port }}
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "e2e-mlops.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "e2e-mlops.selector" (list . "object-store") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "e2e-mlops.labels" . | nindent 8 }}
        app.kubernetes.io/component: object-store
    spec:
      {{- include "e2e-mlops.podCommon" . | nindent 6 }}
      terminationGracePeriodSeconds: 20
      containers:
        - name: seaweedfs
          image: {{ $s3.image }}
          imagePullPolicy: IfNotPresent
          command: ["weed"]
          args:
            - server
            - -dir=/data
            - -ip=127.0.0.1
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB={{ $s3.volumeSizeLimitMB }}
            - -volume.max=0
            - -s3
            - -s3.port={{ $s3.s3Port }}
            - -s3.config=/etc/seaweedfs/s3.json
          env:
            # Signs filer/IAM requests; required by the S3 gateway since SeaweedFS 4.x.
            {{- include "e2e-mlops.secretEnv" (list "WEED_JWT_FILER_SIGNING_KEY" .Values.secrets.objectStore "filer-signing-key") | nindent 12 }}
          ports:
            - name: s3
              containerPort: {{ $s3.s3Port }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml $s3.resources | nindent 12 }}
          readinessProbe:
            tcpSocket: {port: s3}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: s3}
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: s3-config
          secret:
            secretName: {{ .Values.secrets.objectStore }}
            items:
              - key: s3.json
                path: s3.json
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "e2e-mlops.selector" (list . "object-store") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $s3.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $s3.storage.size }}
{{- end }}
