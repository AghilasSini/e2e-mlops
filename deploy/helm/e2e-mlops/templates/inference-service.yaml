{{- if and .Values.inference.enabled (eq (include "e2e-mlops.inferenceMode" .) "deployment") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "e2e-mlops.fullname" . }}-inference
  labels:
    {{- include "e2e-mlops.labels" . | nindent 4 }}
    app.kubernetes.io/component: inference
spec:
  type: {{ .Values.inference.service.type }}
  selector:
    {{- include "e2e-mlops.selector" (list . "inference") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.inference.service.port }}
      targetPort: http
      {{- if and (eq .Values.inference.service.type "NodePort") .Values.inference.service.nodePort }}
      nodePort: {{ .Values.inference.service.nodePort }}
      {{- end }}
{{- end }}
