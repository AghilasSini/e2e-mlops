# Locations used by training and serving.
# Relative paths are resolved against the application root (APP_ROOT, default: the
# current working directory). Each path can be overridden by an environment variable.
data:
  raw_path: data/raw/winequality-red.csv   # env: DATA_PATH
  schema_path: schema.yaml                 # env: SCHEMA_PATH

output:
  dir: outputs                             # env: OUTPUT_DIR
  model_file: model.joblib
  metrics_file: metrics.json
  version_file: model_version

serving:
  # Where the inference service loads its model from.   env: MODEL_URI
  #   models:/<name>@<alias>   registry alias (default: the champion)
  #   models:/<name>/<version> one registered version
  #   ""                       "<output.dir>/<output.model_file>" (offline development)
  model_uri: models:/wine-quality@champion

tracking:
  # MLflow experiment that training runs are recorded under.
  # The server address and credentials come only from the environment:
  # MLFLOW_TRACKING_URI, MLFLOW_TRACKING_USERNAME, MLFLOW_TRACKING_PASSWORD.
  experiment_name: wine-quality

registry:
  # Registered model that training creates versions of; serving loads its
  # `champion` alias (models:/wine-quality@champion).
  model_name: wine-quality
  champion_alias: champion
  previous_alias: previous-champion
