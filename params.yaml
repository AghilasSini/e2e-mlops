# Versioned training parameters. Changing a value here changes the next model;
# no code change is needed.

target:
  source_column: quality   # raw 0-10 score from the dataset
  name: is_good            # binary target derived from it
  threshold: 6             # is_good = 1 when quality >= threshold

split:
  test_size: 0.2
  random_state: 42

model:
  # Logistic regression with an elastic-net penalty: C = 1 / alpha.
  alpha: 0.5
  l1_ratio: 0.7
  max_iter: 5000

promotion:
  # A candidate becomes champion only if it meets every minimum below AND beats the
  # current champion's roc_auc by at least min_improvement on the same test set.
  # Calibration (Epic 2 task 3.3, 2026-11-09): the default hyper-parameters
  # trained on 5 split seeds gave
  #   seed     42     1      7      123    2026
  #   roc_auc  0.824  0.807  0.820  0.845  0.835   (lowest 0.807)
  #   f1       0.755  0.735  0.741  0.762  0.786   (lowest 0.735)
  # Minimums sit ~0.03 below the lowest observed value, so split noise alone never
  # blocks a sound model, while a degenerate one (roc_auc 0.50) is rejected.
  min_roc_auc: 0.78
  min_f1: 0.70
  min_improvement: 0.005
